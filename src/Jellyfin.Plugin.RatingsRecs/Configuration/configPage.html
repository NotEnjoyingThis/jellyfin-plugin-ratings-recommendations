<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ratings &amp; Recommendations</title>
</head>
<body>
    <div id="RatingsRecsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <h2 class="sectionTitle">Ratings &amp; Recommendations</h2>
                <p id="rrVersion" class="fieldDescription"></p>

                <div class="verticalSection">
                    <h3 class="sectionTitle" data-rr-i18n="section.dependencies"></h3>
                    <ul id="rrDependencies"></ul>
                    <ul id="rrHooks"></ul>
                    <div id="rrManualInjection" class="fieldDescription" hidden style="border:1px solid currentColor;border-radius:4px;padding:.8em 1em;">
                        <p><strong data-rr-i18n="manual.title"></strong></p>
                        <p data-rr-i18n-html="manual.install"></p>
                        <p data-rr-i18n="manual.alternative"></p>
                        <pre style="white-space:pre-wrap;">&lt;script defer src="/RatingsRecs/Web/ratings.js"&gt;&lt;/script&gt;</pre>
                        <p data-rr-i18n-html="manual.baseUrl"></p>
                    </div>
                </div>

                <form id="RatingsRecsConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="rrEnabled" type="checkbox" is="emby-checkbox" />
                            <span data-rr-i18n="enabled"></span>
                        </label>
                    </div>

                    <div class="verticalSection">
                        <h3 class="sectionTitle" data-rr-i18n="section.ratings"></h3>
                        <div id="rrLevels"></div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrAmazingSetsFavorite" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="amazingSetsFavorite"></span>
                            </label>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrFavoriteFromOtherClients" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="favoriteFromOtherClients"></span>
                            </label>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="rrSeriesMode" data-rr-i18n="seriesMode"></label>
                            <select is="emby-select" id="rrSeriesMode" class="emby-select-withcolor emby-select">
                                <option value="Series" data-rr-i18n="seriesMode.Series"></option>
                                <option value="Season" data-rr-i18n="seriesMode.Season"></option>
                                <option value="Both" data-rr-i18n="seriesMode.Both"></option>
                            </select>
                            <div class="fieldDescription" data-rr-i18n="seriesMode.hint"></div>
                        </div>
                        <div id="rrCreditsWarning" class="fieldDescription" hidden style="border-left:3px solid currentColor;padding-left:.8em;"></div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrUsersCanChooseMode" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="usersCanChooseMode"></span>
                            </label>
                        </div>
                        <div style="display:flex;gap:1em;flex-wrap:wrap;">
                            <div class="inputContainer" style="flex:1;min-width:12em;">
                                <label class="inputLabel inputLabelUnfocused" for="rrBestSeasonWeight" data-rr-i18n="bestSeasonWeight"></label>
                                <input id="rrBestSeasonWeight" type="number" step="0.05" min="0" is="emby-input" />
                            </div>
                            <div class="inputContainer" style="flex:1;min-width:12em;">
                                <label class="inputLabel inputLabelUnfocused" for="rrAverageSeasonWeight" data-rr-i18n="averageSeasonWeight"></label>
                                <input id="rrAverageSeasonWeight" type="number" step="0.05" min="0" is="emby-input" />
                            </div>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="rrImplicitFavorite" data-rr-i18n="implicitFavorite"></label>
                            <input id="rrImplicitFavorite" type="number" step="0.1" is="emby-input" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="rrImplicitWatched" data-rr-i18n="implicitWatched"></label>
                            <input id="rrImplicitWatched" type="number" step="0.1" is="emby-input" />
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="rrImplicitAbandoned" data-rr-i18n="implicitAbandoned"></label>
                            <input id="rrImplicitAbandoned" type="number" step="0.1" is="emby-input" />
                        </div>
                    </div>

                    <div class="verticalSection">
                        <h3 class="sectionTitle" data-rr-i18n="section.delivery"></h3>
                        <div class="selectContainer">
                            <label class="selectLabel" for="rrHomeRowsMode" data-rr-i18n="homeRows"></label>
                            <select is="emby-select" id="rrHomeRowsMode" class="emby-select-withcolor emby-select">
                                <option value="Auto" data-rr-i18n="homeRows.Auto"></option>
                                <option value="HomeScreenSections" data-rr-i18n="homeRows.HomeScreenSections"></option>
                                <option value="Script" data-rr-i18n="homeRows.Script"></option>
                                <option value="Off" data-rr-i18n="homeRows.Off"></option>
                            </select>
                            <div class="fieldDescription" data-rr-i18n="homeRows.hint"></div>
                        </div>
                        <div style="display:flex;gap:1em;flex-wrap:wrap;">
                            <div class="inputContainer" style="flex:1;min-width:12em;">
                                <label class="inputLabel inputLabelUnfocused" for="rrHomeRowSize" data-rr-i18n="homeRowSize"></label>
                                <input id="rrHomeRowSize" type="number" step="1" min="1" max="100" is="emby-input" />
                            </div>
                            <div class="inputContainer" style="flex:1;min-width:12em;">
                                <label class="inputLabel inputLabelUnfocused" for="rrSimilarRowSize" data-rr-i18n="similarRowSize"></label>
                                <input id="rrSimilarRowSize" type="number" step="1" min="1" max="50" is="emby-input" />
                            </div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrShowSimilarRow" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="showSimilarRow"></span>
                            </label>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrShowMenuEntry" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="showMenuEntry"></span>
                            </label>
                        </div>
                        <div id="rrSimilarProviderBlock" hidden>
                            <h4 data-rr-i18n="provider.title"></h4>
                            <div class="fieldDescription" data-rr-i18n="provider.hint"></div>
                            <div id="rrSimilarLibraries"></div>
                        </div>
                        <div id="rrOverrideBlock" hidden>
                            <h4 data-rr-i18n="override.title"></h4>
                            <div class="checkboxContainer checkboxContainer-withDescription">
                                <label class="emby-checkbox-label">
                                    <input id="rrOverrideSuggestions" type="checkbox" is="emby-checkbox" />
                                    <span data-rr-i18n="override.label"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription" data-rr-i18n="override.hint"></div>
                            </div>
                        </div>
                    </div>

                    <div class="verticalSection">
                        <h3 class="sectionTitle" data-rr-i18n="section.engine"></h3>
                        <div id="rrEngine" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:0 1em;"></div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="rrExcludeHatedCollections" type="checkbox" is="emby-checkbox" />
                                <span data-rr-i18n="excludeHatedCollections"></span>
                            </label>
                        </div>
                        <div class="fieldDescription" data-rr-i18n="engine.hint"></div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span data-rr-i18n="save"></span>
                        </button>
                    </div>
                </form>

                <div class="verticalSection">
                    <h3 class="sectionTitle" data-rr-i18n="section.tools"></h3>
                    <div class="selectContainer">
                        <label class="selectLabel" for="rrToolUser" data-rr-i18n="tools.user"></label>
                        <select is="emby-select" id="rrToolUser" class="emby-select-withcolor emby-select"></select>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:.5em;">
                        <button is="emby-button" type="button" id="rrImportFavorites" class="raised emby-button"><span data-rr-i18n="tools.importFavorites"></span></button>
                        <button is="emby-button" type="button" id="rrExportCsv" class="raised emby-button"><span data-rr-i18n="tools.exportCsv"></span></button>
                        <button is="emby-button" type="button" id="rrImportCsvButton" class="raised emby-button"><span data-rr-i18n="tools.importCsv"></span></button>
                        <input type="file" id="rrImportCsvFile" accept=".csv,text/csv" style="display:none" />
                        <button is="emby-button" type="button" id="rrRecompute" class="raised emby-button"><span data-rr-i18n="tools.recompute"></span></button>
                        <button is="emby-button" type="button" id="rrPreview" class="raised emby-button"><span data-rr-i18n="tools.preview"></span></button>
                    </div>
                    <pre id="rrToolResult" class="fieldDescription" style="white-space:pre-wrap;"></pre>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var pluginId = '4d56ae7e-38cb-431c-bff8-e135c2087aa5';
                var dependencies = [
                    { id: '5e87cc92-571a-4d8d-8d98-d2d4147f9f90', name: 'File Transformation', required: true },
                    { id: 'b8298e01-2697-407a-b44d-aa8dc795e850', name: 'Home Screen Sections', required: false },
                    { id: '5b6550fa-a014-4f4c-8a2c-59a43680ac6d', name: 'Plugin Pages', required: false }
                ];
                var levels = ['Hate', 'Watchable', 'Good', 'Amazing'];
                var engineFields = [
                    { key: 'WeightGenre' }, { key: 'WeightDirector' }, { key: 'WeightActor' }, { key: 'WeightWriter' },
                    { key: 'WeightTag' }, { key: 'WeightStudio' }, { key: 'WeightDecade' }, { key: 'WeightCollection' },
                    { key: 'SmoothingK' }, { key: 'HalfLifeDays' }, { key: 'TasteWeight' }, { key: 'QualityWeight' },
                    { key: 'ExplorationWeight' }, { key: 'DiversityLambda' }, { key: 'ProximityPenalty' },
                    { key: 'ColdStartThreshold', integer: true }, { key: 'OnboardingHideAfter', integer: true }
                ];
                var similarLibraryTypes = ['movies', 'tvshows', 'mixed'];
                var page = document.querySelector('#RatingsRecsConfigPage');
                var strings = { en: {}, current: {} };

                function q(sel) { return page.querySelector(sel); }

                function normalize(id) {
                    return (id || '').replace(/-/g, '').toLowerCase();
                }

                // Same rule as the web script: the web client's language, then the browser's; English for missing texts.
                function language() {
                    var raw = document.documentElement.getAttribute('lang') || navigator.language || 'en';
                    return raw.toLowerCase().slice(0, 2) || 'en';
                }

                function t(key) {
                    var text = strings.current[key] || strings.en[key] || key;
                    var args = Array.prototype.slice.call(arguments, 1);
                    return text.replace(/\{(\d)\}/g, function (match, index) {
                        var value = args[Number(index)];
                        return value === undefined || value === null ? '' : String(value);
                    });
                }

                function loadStrings() {
                    function get(lang) {
                        return fetch(ApiClient.getUrl('RatingsRecs/Web/i18n/config.' + lang + '.json'))
                            .then(function (r) { return r.ok ? r.json() : {}; })
                            .catch(function () { return {}; });
                    }
                    var lang = language();
                    return Promise.all([get('en'), lang === 'en' ? Promise.resolve(null) : get(lang)]).then(function (results) {
                        strings.en = results[0];
                        strings.current = results[1] || results[0];
                    });
                }

                function translatePage() {
                    Array.prototype.forEach.call(page.querySelectorAll('[data-rr-i18n]'), function (el) {
                        el.textContent = t(el.getAttribute('data-rr-i18n'));
                    });
                    // Static markup from the plugin's own translation files (links and code samples).
                    Array.prototype.forEach.call(page.querySelectorAll('[data-rr-i18n-html]'), function (el) {
                        el.innerHTML = t(el.getAttribute('data-rr-i18n-html'));
                    });
                }

                function authHeaders(extra) {
                    var headers = { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' };
                    Object.keys(extra || {}).forEach(function (k) { headers[k] = extra[k]; });
                    return headers;
                }

                function showResult(text) {
                    q('#rrToolResult').textContent = text;
                }

                function showError(status) {
                    showResult(t('result.error', status));
                }

                function field(container, id, labelText, type, step, attrs) {
                    var wrapper = document.createElement('div');
                    wrapper.className = 'inputContainer';
                    var label = document.createElement('label');
                    label.className = 'inputLabel inputLabelUnfocused';
                    label.setAttribute('for', id);
                    label.textContent = labelText;
                    var input = document.createElement('input');
                    input.id = id;
                    input.type = type;
                    input.setAttribute('is', 'emby-input');
                    if (step) { input.step = step; }
                    Object.keys(attrs || {}).forEach(function (k) { input.setAttribute(k, attrs[k]); });
                    wrapper.appendChild(label);
                    wrapper.appendChild(input);
                    container.appendChild(wrapper);
                    return wrapper;
                }

                function renderLevels() {
                    var container = q('#rrLevels');
                    container.innerHTML = '';
                    levels.forEach(function (key) {
                        var row = document.createElement('div');
                        row.style.cssText = 'display:flex;gap:1em;flex-wrap:wrap;';
                        field(row, 'rrName' + key, t('level.name', t('level.' + key)), 'text', null, { placeholder: t('level.default') }).style.cssText = 'flex:2;min-width:12em;';
                        field(row, 'rrValue' + key, t('level.value'), 'number', '0.1').style.cssText = 'flex:1;min-width:8em;';
                        container.appendChild(row);
                    });
                    var engine = q('#rrEngine');
                    engine.innerHTML = '';
                    engineFields.forEach(function (f) {
                        field(engine, 'rrCfg' + f.key, t('engine.' + f.key), 'number', f.integer ? '1' : '0.05', { min: '0' });
                    });
                }

                function renderPlugins(plugins) {
                    var self = plugins.filter(function (p) { return normalize(p.Id) === normalize(pluginId); })[0];
                    q('#rrVersion').textContent = self ? t('version', self.Version, self.Status) : '';
                    var list = q('#rrDependencies');
                    list.innerHTML = '';
                    dependencies.forEach(function (dep) {
                        var found = plugins.filter(function (p) { return normalize(p.Id) === normalize(dep.id); })[0];
                        var li = document.createElement('li');
                        li.textContent = dep.name + ': ' + (found ? (found.Version + ' (' + found.Status + ')') : t(dep.required ? 'dep.notInstalledRequired' : 'dep.notInstalled'));
                        list.appendChild(li);
                    });
                }

                function renderSimilarLibraries(folders, selectedIds) {
                    var container = q('#rrSimilarLibraries');
                    container.innerHTML = '';
                    var selected = (selectedIds || []).map(normalize);
                    folders.filter(function (f) {
                        return !f.CollectionType || similarLibraryTypes.indexOf(f.CollectionType) !== -1;
                    }).forEach(function (f) {
                        var wrapper = document.createElement('div');
                        wrapper.className = 'checkboxContainer';
                        var label = document.createElement('label');
                        label.className = 'emby-checkbox-label';
                        var input = document.createElement('input');
                        input.type = 'checkbox';
                        input.setAttribute('is', 'emby-checkbox');
                        input.className = 'rrSimilarLibrary';
                        input.setAttribute('data-id', normalize(f.ItemId));
                        input.checked = selected.indexOf(normalize(f.ItemId)) !== -1;
                        var span = document.createElement('span');
                        span.textContent = f.Name;
                        label.appendChild(input);
                        label.appendChild(span);
                        wrapper.appendChild(label);
                        container.appendChild(wrapper);
                    });
                }

                function renderStatus(status) {
                    var list = q('#rrHooks');
                    list.innerHTML = '';
                    var webActive = false;
                    (status.hooks || []).forEach(function (hook) {
                        var li = document.createElement('li');
                        var name = strings.en['hook.' + hook.name] ? t('hook.' + hook.name) : hook.name;
                        li.textContent = name + ': ' + t('state.' + hook.state) + (hook.message ? ' - ' + hook.message : '');
                        list.appendChild(li);
                        if (hook.name === 'WebInjection' && hook.state === 'Active') { webActive = true; }
                    });
                    q('#rrManualInjection').hidden = webActive;
                    var credits = status.seasonCredits;
                    var warning = q('#rrCreditsWarning');
                    if (credits && credits.seasons > 0) {
                        warning.hidden = false;
                        warning.textContent = t('creditsWarning', credits.percentWithoutCredits, credits.withoutCredits, credits.seasons);
                    }
                    if (status.version) {
                        q('#rrVersion').textContent += t('build', status.jellyfinLine, status.targetAbi);
                    }
                    q('#rrSimilarProviderBlock').hidden = status.jellyfinLine !== '12';
                    q('#rrOverrideBlock').hidden = status.jellyfinLine !== '10.11';
                }

                function renderUsers(users) {
                    var select = q('#rrToolUser');
                    var current = ApiClient.getCurrentUserId();
                    select.innerHTML = '';
                    users.forEach(function (u) {
                        var option = document.createElement('option');
                        option.value = u.Id;
                        option.textContent = u.Name;
                        if (normalize(u.Id) === normalize(current)) { option.selected = true; }
                        select.appendChild(option);
                    });
                }

                function loadConfig(config) {
                    q('#rrEnabled').checked = config.Enabled;
                    levels.forEach(function (key) {
                        q('#rrName' + key).value = config['Name' + key] || '';
                        q('#rrValue' + key).value = config['Value' + key];
                    });
                    q('#rrAmazingSetsFavorite').checked = config.AmazingSetsFavorite;
                    q('#rrFavoriteFromOtherClients').checked = config.FavoriteFromOtherClientsCounts;
                    q('#rrImplicitFavorite').value = config.ImplicitFavoriteValue;
                    q('#rrImplicitWatched').value = config.ImplicitWatchedValue;
                    q('#rrImplicitAbandoned').value = config.ImplicitAbandonedValue;
                    engineFields.forEach(function (f) { q('#rrCfg' + f.key).value = config[f.key]; });
                    q('#rrSeriesMode').value = config.SeriesRatingMode || 'Series';
                    q('#rrUsersCanChooseMode').checked = config.UsersCanChooseSeriesMode;
                    q('#rrBestSeasonWeight').value = config.SeriesBestSeasonWeight;
                    q('#rrHomeRowsMode').value = config.HomeRowsMode || 'Auto';
                    q('#rrHomeRowSize').value = config.HomeRowSize;
                    q('#rrSimilarRowSize').value = config.SimilarRowSize;
                    q('#rrShowSimilarRow').checked = config.ShowSimilarRow;
                    q('#rrShowMenuEntry').checked = config.ShowMenuEntry;
                    q('#rrOverrideSuggestions').checked = config.OverrideSuggestions;
                    q('#rrAverageSeasonWeight').value = config.SeriesAverageSeasonWeight;
                    q('#rrExcludeHatedCollections').checked = config.ExcludeHatedCollections;
                }

                function readNumber(sel, fallback) {
                    var v = parseFloat(q(sel).value);
                    return isNaN(v) ? fallback : v;
                }

                function toolUrl(path) {
                    return ApiClient.getUrl('RatingsRecs/' + path, { userId: q('#rrToolUser').value });
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    loadStrings().then(function () {
                        translatePage();
                        renderLevels();
                        return Promise.all([
                            ApiClient.getPluginConfiguration(pluginId),
                            ApiClient.getJSON(ApiClient.getUrl('Plugins')),
                            ApiClient.getJSON(ApiClient.getUrl('Users')),
                            ApiClient.getJSON(ApiClient.getUrl('RatingsRecs/Status')).catch(function () { return { hooks: [] }; }),
                            ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders')).catch(function () { return []; })
                        ]);
                    }).then(function (results) {
                        loadConfig(results[0]);
                        renderPlugins(results[1]);
                        renderUsers(results[2]);
                        renderStatus(results[3]);
                        renderSimilarLibraries(results[4], results[0].SimilarProviderLibraryIds);
                        Dashboard.hideLoadingMsg();
                    }, function () {
                        Dashboard.hideLoadingMsg();
                    });
                });

                q('#RatingsRecsConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.Enabled = q('#rrEnabled').checked;
                        levels.forEach(function (key) {
                            config['Name' + key] = q('#rrName' + key).value.trim();
                            config['Value' + key] = readNumber('#rrValue' + key, config['Value' + key]);
                        });
                        config.AmazingSetsFavorite = q('#rrAmazingSetsFavorite').checked;
                        config.FavoriteFromOtherClientsCounts = q('#rrFavoriteFromOtherClients').checked;
                        config.ImplicitFavoriteValue = readNumber('#rrImplicitFavorite', config.ImplicitFavoriteValue);
                        config.ImplicitWatchedValue = readNumber('#rrImplicitWatched', config.ImplicitWatchedValue);
                        config.ImplicitAbandonedValue = readNumber('#rrImplicitAbandoned', config.ImplicitAbandonedValue);
                        engineFields.forEach(function (f) {
                            var v = readNumber('#rrCfg' + f.key, config[f.key]);
                            config[f.key] = f.integer ? Math.round(v) : v;
                        });
                        config.ExcludeHatedCollections = q('#rrExcludeHatedCollections').checked;
                        config.SeriesRatingMode = q('#rrSeriesMode').value;
                        config.UsersCanChooseSeriesMode = q('#rrUsersCanChooseMode').checked;
                        config.SeriesBestSeasonWeight = readNumber('#rrBestSeasonWeight', config.SeriesBestSeasonWeight);
                        config.HomeRowsMode = q('#rrHomeRowsMode').value;
                        config.HomeRowSize = Math.max(1, Math.round(readNumber('#rrHomeRowSize', config.HomeRowSize)));
                        config.SimilarRowSize = Math.max(1, Math.round(readNumber('#rrSimilarRowSize', config.SimilarRowSize)));
                        config.ShowSimilarRow = q('#rrShowSimilarRow').checked;
                        config.ShowMenuEntry = q('#rrShowMenuEntry').checked;
                        if (!q('#rrSimilarProviderBlock').hidden) {
                            config.SimilarProviderLibraryIds = Array.prototype.filter.call(page.querySelectorAll('.rrSimilarLibrary'), function (c) { return c.checked; })
                                .map(function (c) { return c.getAttribute('data-id'); });
                        }
                        if (!q('#rrOverrideBlock').hidden) {
                            config.OverrideSuggestions = q('#rrOverrideSuggestions').checked;
                        }
                        config.SeriesAverageSeasonWeight = readNumber('#rrAverageSeasonWeight', config.SeriesAverageSeasonWeight);
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                            return ApiClient.getJSON(ApiClient.getUrl('RatingsRecs/Status')).then(renderStatus);
                        });
                    });
                    return false;
                });

                q('#rrImportFavorites').addEventListener('click', function () {
                    fetch(toolUrl('ImportFavorites'), { method: 'POST', headers: authHeaders() })
                        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
                        .then(function (res) { showResult(t('result.imported', res.imported, res.alreadyRated)); }, showError);
                });

                q('#rrExportCsv').addEventListener('click', function () {
                    fetch(toolUrl('Export'), { headers: authHeaders() })
                        .then(function (r) { return r.ok ? r.blob() : Promise.reject(r.status); })
                        .then(function (blob) {
                            var a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = 'ratings-' + q('#rrToolUser').selectedOptions[0].textContent + '.csv';
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                            showResult(t('result.exported'));
                        }, showError);
                });

                q('#rrRecompute').addEventListener('click', function () {
                    ApiClient.getJSON(ApiClient.getUrl('ScheduledTasks')).then(function (tasks) {
                        var task = tasks.filter(function (x) { return x.Key === 'RatingsRecsRecompute'; })[0];
                        if (!task) { return Promise.reject('task not found'); }
                        return fetch(ApiClient.getUrl('ScheduledTasks/Running/' + task.Id), { method: 'POST', headers: authHeaders() });
                    }).then(function () {
                        showResult(t('result.recomputeStarted'));
                    }, showError);
                });

                q('#rrPreview').addEventListener('click', function () {
                    fetch(toolUrl('Recommendations') + '&limit=20', { headers: authHeaders() })
                        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
                        .then(function (res) {
                            if (res.Status === 'Computing') { showResult(t('result.computing')); return; }
                            var lines = [t('result.computed', res.ComputedUtc, res.ExplicitRatingCount) + (res.IsColdStart ? t('result.coldStart') : '')];
                            res.Items.forEach(function (item, i) {
                                var e = res.Explanations[i] || {};
                                var why = (e.Features || []).map(function (f) { return f.Category + ': ' + f.Value; });
                                if (e.BecauseOf) { why.unshift(t('result.because', e.BecauseOf.Name)); }
                                lines.push((i + 1) + '. ' + item.Name + ' (' + item.Type + (item.ProductionYear ? ', ' + item.ProductionYear : '') + ') - ' + why.join('; '));
                            });
                            showResult(lines.join('\n'));
                        }, showError);
                });

                q('#rrImportCsvButton').addEventListener('click', function () {
                    q('#rrImportCsvFile').click();
                });

                q('#rrImportCsvFile').addEventListener('change', function (e) {
                    var file = e.target.files[0];
                    if (!file) { return; }
                    file.text().then(function (text) {
                        return fetch(toolUrl('Import'), { method: 'POST', headers: authHeaders({ 'Content-Type': 'text/csv' }), body: text });
                    }).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
                      .then(function (res) {
                          var lines = [t('result.added', res.added), t('result.updated', res.updated), t('result.skipped', res.skipped), t('result.unmatched', res.unmatched)];
                          if (res.unmatchedNames.length) { lines.push('  ' + res.unmatchedNames.join(', ')); }
                          res.errors.forEach(function (err) { lines.push(t('result.line', err.line, err.message)); });
                          showResult(lines.join('\n'));
                      }, showError);
                    e.target.value = '';
                });
            })();
        </script>
    </div>
</body>
</html>
