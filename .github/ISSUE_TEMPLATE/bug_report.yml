name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in every field: most bugs depend on the Jellyfin version and the web layout.
        Italian is welcome too / Va bene anche in italiano.
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      description: Dashboard → General (e.g. 10.11.11 or 12.4.0)
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Dashboard → Plugins → Ratings & Recommendations (e.g. 1.0.0.0)
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Web layout
      options:
        - Modern (default in Jellyfin 12)
        - Legacy
        - Not a web client issue
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: e.g. Firefox 140 on Windows 11, or the app name if not a browser
    validations:
      required: true
  - type: checkboxes
    id: dependencies
    attributes:
      label: Related plugins installed
      options:
        - label: File Transformation
        - label: Home Screen Sections
        - label: Plugin Pages
        - label: Other recommendation plugins (Reco+, LocalRecs, ...)
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: server-log
    attributes:
      label: Server log
      description: Dashboard → Logs. Lines mentioning RatingsRecs, from server start to the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: console-log
    attributes:
      label: Browser console log
      description: F12 → Console. Lines starting with [RatingsRecs] and any red errors.
      render: text
