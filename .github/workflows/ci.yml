name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.RatingsRecommendations.sln

      - name: Check web client script syntax
        run: node --check src/Jellyfin.Plugin.RatingsRecs/Web/ratings.js

      - name: Check formatting
        run: dotnet format Jellyfin.Plugin.RatingsRecommendations.sln --verify-no-changes --no-restore

      - name: Build (net9.0 for Jellyfin 10.11, net10.0 for Jellyfin 12)
        run: dotnet build Jellyfin.Plugin.RatingsRecommendations.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.RatingsRecommendations.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Package (both zips)
        run: bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: |
            artifacts/*.zip
            artifacts/*.md5
            artifacts/*.sha256
